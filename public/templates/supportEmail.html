
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Support Request</title>
</head>
    <body style="margin: 0; padding: 0; background-color: #f5f5f5;">
        <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; color: #333333; background-color: #ffffff;">

            <h2 style="color: #240457; margin-bottom: 8px;">New Support Request</h2>

            <p style="color: #666666; font-size: 14px;">
                A new support request has been submitted. Please review the details below.
            </p>

            <hr style="border: none; border-top: 1px solid #eeeeee; margin: 24px 0;">

            <p> <strong>From:</strong> 
                {{email}}
            </p>
            <p> <strong>Category:</strong> 
                {{category}}
            </p>
            <p> <strong>Subject:</strong>
                {{subject}}
            </p>

            <h3 style="color: #240457; margin-top: 28px;">Message</h3>
            <div style="background-color: #f8f7fc; padding: 16px; border-radius: 8px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: break-word;">
                {{body}}
            </div>
            <hr style="border: none; border-top: 1px solid #eeeeee; margin: 24px 0;">
        </div>
    </body>
</html>
